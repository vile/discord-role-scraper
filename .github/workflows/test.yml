name: Dirty Script Test

on:
  push:
    paths:
      - '**.py'
  workflow_dispatch:

jobs:
  test:
    name: Dirty Script Test
    runs-on: ubuntu-latest
    environment: discord_live_testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.11.0'

      - name: Install PyInstaller & Script Dependencies
        run: |
          pip install -U pyinstaller
          pip install -r requirements.txt

      - name: Build for Linux
        run: |
          pyinstaller main.py --onefile --name DiscordRoleScraper
          mv dist/DiscordRoleScraper .
          chmod +x DiscordRoleScraper

      - name: Change Config File Settings
        run: |
          chmod +x .github/change_config_settings.sh
          sudo .github/change_config_settings.sh export_results false
          sudo .github/change_config_settings.sh scrape_channel_overwrite_info true

      - name: Test Script Runs with CLI Args
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_SERVER_ID: ${{ secrets.DISCORD_SERVER_ID }}
        timeout-minutes: 2
        run: | 
          python3 main.py "$DISCORD_TOKEN" "$DISCORD_SERVER_ID" true
          ./DiscordRoleScraper "$DISCORD_TOKEN" "$DISCORD_SERVER_ID" true